# DO-NOT-EDIT. Generated by nix/ci.nix. Regenerate: nix run .#write-files
# Jobs: flake-check fmt srs-test
"concurrency":
  "cancel-in-progress": "${{ github.ref != 'refs/heads/main' }}"
  "group": "${{ github.workflow }}-${{ github.ref }}"
"jobs":
  "flake-check":
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "nix flake check"
        "run": "nix flake check -L"
    "timeout-minutes": 20
  "fmt":
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "every nix file is formatted (nixfmt)"
        "run": "nix develop -c fmt-check"
      -
        "name": "the workflows are valid (actionlint)"
        "run": "nix develop -c lint"
    "timeout-minutes": 10
  "srs-test":
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "srs gate: fixpoint, seed, programs"
        "run": "nix develop -c srs-test"
    "timeout-minutes": 20
"name": "ci"
"on":
  "pull_request": {}
  "push":
    "branches":
      - "main"
  "workflow_dispatch": {}
"permissions":
  "contents": "read"
